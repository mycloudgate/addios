<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deportes Demo</title>
<link rel="icon" type="image/png" href="/addios/demo/deportes/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/addios/demo/deportes/icon.png">
<style>
  :root { --c:#b91c1c; --cl:#f87171; --y:#fde047; --r:#dc2626; --t:#111827; --m:#4b5563; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--t); background:#f3f4f6; line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; background:#fff; }
  header { background:var(--c); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
  header b { font-size:20px; } header span { font-size:12px; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:999px; }
  main { padding:16px; } h1 { font-size:24px; line-height:1.2; margin:8px 0 6px; } p { margin:0 0 12px; } .muted { color:var(--m); font-size:14px; }
  .head-banner { border:2px solid var(--cl); border-radius:12px; padding:14px 16px; margin:4px 0 14px; background:#f9fafb; }
  .head-banner strong { display:block; font-size:16px; color:var(--c); }
  article { padding:12px 0; border-bottom:1px solid var(--line); } article h2 { font-size:18px; margin:0 0 4px; }
  #download-slot { border:1px dashed #9ca3af; border-radius:12px; padding:14px 16px; margin:18px 0 8px; }
  footer { padding:18px 16px 24px; font-size:13px; color:var(--m); border-top:1px solid var(--line); }
  .ad-label { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#6b7280; display:block; margin-bottom:4px; }
  .ad-btn { display:inline-block; background:var(--r); color:#fff; font-weight:800; padding:8px 14px; border-radius:6px; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  .ad-banner-top { padding:10px 12px; background:repeating-linear-gradient(45deg,#fef08a,#fef08a 14px,#fde047 14px,#fde047 28px); text-align:center; border-bottom:3px solid var(--r); }
  .ad-banner-top h3 { margin:2px 0; font-size:22px; color:var(--r); text-transform:uppercase; }
  #ad-slot-inline { margin:16px 0; padding:14px; background:#ecfeff; border:2px solid #22d3ee; text-align:center; } #ad-slot-inline b { font-size:19px; }
  #ad-slot-cards { margin:20px 0; } #ad-slot-cards .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  #ad-slot-cards .card { border:1px solid #d1d5db; border-radius:10px; padding:12px; background:#fff; }
  #ad-slot-cards .card .img { height:70px; border-radius:6px; margin-bottom:8px; background:linear-gradient(135deg,#fde68a,#fca5a5); }
  #ad-slot-cards .card:nth-child(2) .img { background:linear-gradient(135deg,#a5f3fc,#c7d2fe); } #ad-slot-cards .card:nth-child(3) .img { background:linear-gradient(135deg,#bbf7d0,#fef08a); }
  .ad-banner-sticky { position:fixed; left:0; right:0; bottom:0; z-index:50; background:#111827; color:#fff; text-align:center; padding:10px 12px; border-top:3px solid var(--y); }
  .ad-banner-sticky b { color:var(--y); } .ad-banner-spacer { height:70px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ad-banner ad-banner-top" data-demo-ad>
    <span class="ad-label" data-i18n="label">Publicidad</span>
    <h3 data-i18n="ad_top"></h3>
    <div class="ad-btn" data-i18n="btn"></div>
  </div>
  <header><b>Deportes Demo</b><span data-i18n="tag"></span></header>
  <main>
    <div class="head-banner"><strong data-i18n="hero_t"></strong><span data-i18n="hero_s"></span></div>
    <h1 data-i18n="h1"></h1>
    <p class="muted" data-i18n="intro"></p>
    <article><h2 data-i18n="a1_t"></h2><p data-i18n="a1_p"></p></article>
    <div id="ad-slot-inline" data-demo-ad>
      <span class="ad-label" data-i18n="label">Publicidad</span>
      <b data-i18n="ad_inline"></b><br><small data-i18n="ad_inline_sub"></small>
    </div>
    <article><h2 data-i18n="a2_t"></h2><p data-i18n="a2_p"></p></article>
    <article><h2 data-i18n="a3_t"></h2><p data-i18n="a3_p"></p></article>
    <section id="ad-slot-cards" data-demo-ad>
      <span class="ad-label" data-i18n="sponsored"></span>
      <div class="grid">
        <div class="card"><div class="img"></div><b data-i18n="c1"></b></div>
        <div class="card"><div class="img"></div><b data-i18n="c2"></b></div>
        <div class="card"><div class="img"></div><b data-i18n="c3"></b></div>
      </div>
    </section>
    <div id="download-slot"><b data-i18n="dl_t"></b><p class="muted" data-i18n="dl_p"></p></div>
  </main>
  <footer data-i18n="footer"></footer>
  <div class="ad-banner ad-banner-spacer" data-demo-ad></div>
</div>
<div class="ad-banner ad-banner-sticky" data-demo-ad>
  <span class="ad-label" style="color:#9ca3af" data-i18n="label">Publicidad</span>
  <b data-i18n="ad_sticky"></b>
</div>
<script>
(function () {
  var dict = {"es": {"tag": "sitio de demostración", "label": "Publicidad", "btn": "¡Solo hoy!", "sponsored": "Contenido patrocinado", "footer": "Página de demostración creada para mostrar cómo Addiós oculta la publicidad. Todos los datos y todos los anunciantes son ficticios.", "dl_t": "Descarga la guía en PDF", "dl_p": "Un archivo de ejemplo (demostración, no descarga nada).", "hero_t": "Resultados de la jornada", "hero_s": "Equipos y resultados inventados.", "h1": "Lo último del fin de semana", "intro": "Una liga que no existe.", "a1_t": "Unión Demo gana 2-1 al Deportivo Imaginario", "a1_p": "Un gol en el último minuto decidió un partido muy igualado en el estadio municipal.", "a2_t": "Empate sin goles en el derbi de la ciudad", "a2_p": "Mucho ritmo y poco acierto en un derbi que se quedó sin ganador.", "a3_t": "La jornada de atletismo bate el récord de participantes", "a3_p": "Más de mil personas corrieron este domingo en la prueba popular del parque.", "ad_top": "Zapatillas deportivas -50 %", "ad_inline": "Tu equipo, sin perderte nada*", "ad_inline_sub": "*Anuncio de demostración, no existe tal servicio", "ad_sticky": "Descarga la app de resultados: ¡alertas de gol!", "c1": "Cómo empezar a correr", "c2": "Los mejores estiramientos", "c3": "Material para el gimnasio en casa"}, "en": {"tag": "demo site", "label": "Advertisement", "btn": "Today only!", "sponsored": "Sponsored content", "footer": "Demo page created to show how Addiós hides advertising. All data and all advertisers are fictional.", "dl_t": "Download the PDF guide", "dl_p": "A sample file (demo only, it downloads nothing).", "hero_t": "Matchday results", "hero_s": "Invented teams and results.", "h1": "The latest from the weekend", "intro": "A league that does not exist.", "a1_t": "Unión Demo beat Deportivo Imaginario 2-1", "a1_p": "A last-minute goal decided a very even match at the municipal stadium.", "a2_t": "Goalless draw in the city derby", "a2_p": "Lots of pace and little accuracy in a derby that ended without a winner.", "a3_t": "The athletics day breaks the participation record", "a3_p": "More than a thousand people ran on Sunday in the popular race in the park.", "ad_top": "Sports shoes -50%", "ad_inline": "Your team, never miss a thing*", "ad_inline_sub": "*Demo advertisement, no such service exists", "ad_sticky": "Get the results app: goal alerts!", "c1": "How to start running", "c2": "The best stretches", "c3": "Gear for a home gym"}};
  var q = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
  var lang = q === 'en' || q === 'es' ? q : ((navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es');
  document.documentElement.lang = lang;
  var els = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < els.length; i++) { var v = dict[lang][els[i].getAttribute('data-i18n')]; if (v) els[i].textContent = v; }
})();
</script>
</body>
</html>
